infrena: ">= 0.7"

project: ec2-example

environments:
  dev: {}

variables:
  aws_region:
    type: string
    default: us-east-1

providers:
  - plugin: aws
    defaults:
      region: ${var.aws_region}

resources:
  vpc:
    type: aws.vpc
    cidr: 10.0.0.0/16
    enable_dns_support: true
    enable_dns_hostnames: true
    tags:
      Name: ec2-example-vpc

  public_subnet:
    type: aws.subnet
    vpc: ${vpc}
    cidr: 10.0.1.0/24
    az: us-east-1a
    map_public_ip_on_launch: true
    tags:
      Name: public-subnet

  ec2_key_pair:
    type: aws.keypair
    key_name: ec2-example-key
    key_type: ed25519
    tags:
      Name: ec2-example-key

  server_security_group:
    type: aws.securitygroup
    description: Security group for EC2 instances
    vpc_id: ${vpc}
    ingress:
      - ip_protocol: tcp
        from_port: 22
        to_port: 22
        cidr_ip: 0.0.0.0/0
      - ip_protocol: tcp
        from_port: 80
        to_port: 80
        cidr_ip: 0.0.0.0/0
    tags:
      Name: server-sg

  web_instance:
    type: aws.ec2.instance
    image_id: ami-0c55b159cbfafe1f0
    instance_type: t3.micro
    subnet_id: ${public_subnet}
    key_name: ${ec2_key_pair.KeyName}
    security_group_ids:
      - ${server_security_group}
    user_data: |
      #!/bin/bash
      apt-get update
      apt-get install -y nginx
      systemctl start nginx
    tags:
      Name: web-server

  data_volume:
    type: aws.ec2.volume
    size: 50
    volume_type: gp3
    availability_zone: us-east-1a
    tags:
      Name: data-volume

  app_launch_template:
    type: aws.launchtemplate
    launch_template_name: app-server-template
    launch_template_data:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: t3.small
      KeyName: ${ec2_key_pair.KeyName}
      SecurityGroupIds:
        - ${server_security_group.GroupId}
