inputs:
  name:
    type: string
  s3_bucket:
    type: string
  s3_key:
    type: string
  handler:
    type: string
  runtime:
    type: string
    default: python3.12
  memory:
    type: integer
    default: 256
  timeout:
    type: integer
    default: 30

resources:
  execution_role:
    type: aws.role
    role_name: ${var.name}-lambda-execution-role
    assume_role_policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "lambda.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
    managed_policy_arns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  log_group:
    type: aws.loggroup
    log_group_name: /aws/lambda/${var.name}
    retention_in_days: 7

  function:
    type: aws.lambda.function
    function_name: ${var.name}
    role: ${execution_role.Arn}
    handler: ${var.handler}
    runtime: ${var.runtime}
    memory_size: ${var.memory}
    timeout: ${var.timeout}
    code:
      S3Bucket: ${var.s3_bucket}
      S3Key: ${var.s3_key}

outputs:
  function_name:
    value: ${function.FunctionName}
  function_arn:
    value: ${function.Arn}
